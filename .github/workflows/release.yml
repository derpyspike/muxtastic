name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.0 (must match the Cargo version)"
        required: true
        type: string
      draft:
        description: "Create as a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc libc6-dev make pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the Cargo version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "muxtastic") | .version')"
          if [[ "${TAG#v}" != "${version}" ]]; then
            echo "::error::tag ${TAG} does not match the Cargo version ${version}"
            exit 1
          fi
          echo "Releasing muxtastic ${version} from tag ${TAG}"

      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            cross: false
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            cross: true
          - name: linux-armv7
            target: armv7-unknown-linux-gnueabihf
            cross: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gcc libc6-dev make pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.cross
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Verify binary
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            file "target/${{ matrix.target }}/release/muxtastic"
          else
            "target/${{ matrix.target }}/release/muxtastic" --version
          fi

      - name: Package release archive
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          safe_tag="${TAG//\//-}"
          name="muxtastic-${safe_tag}-${{ matrix.name }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/muxtastic" "dist/${name}/"
          cp -r configs docs README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Show release assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
