# broker = ""
# port = 8883
# tls = true
# username = ""
# password = ""
# keepalive = 60
# raw_uplink = false
# raw_scope = "uncovered"

[logging]
level = "info"                  # debug, info, warning, error
file = "logs/muxtastic.log"     # empty string = console only
console = true
