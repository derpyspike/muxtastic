[workspace]
resolver = "2"
members = ["crates/muxtastic-core", "crates/muxtastic-web", "crates/muxtastic"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
authors = ["The Muxtastic contributors"]
description = "A simple, readable Rust rewrite of the Multiplextashtic Meshtastic multiplexer"

[workspace.dependencies]
meshtastic = { version = "0.1.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
